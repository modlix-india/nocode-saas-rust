# Which Java sources each Rust crate ports, and the commit of that repo it was last reconciled
# with. The Java services keep changing during the port; tools/java_drift.py lists every commit
# and every uncommitted change in these paths since `reconciled`, so nothing is missed.
#
# After folding a crate's changes in: tools/java_drift.py --mark <crate> [commit]
# (defaults to the repo's HEAD; uncommitted changes stay listed until they are committed and the
# crate is marked again).

java_repo = "../nocode-saas"
kirun_repo = "../nocode-kirun"

[crates.platform]
reconciled = "e2b7d48aa"
paths = ["commons/src", "commons-security/src", "commons-mq/src", "configfiles"]

[crates.gateway]
reconciled = "c2672b6f8"
paths = ["gateway/src"]

[crates.files]
reconciled = "c2672b6f8"
paths = ["files/src", "commons2/src", "commons2-security/src", "commons2-jooq/src"]

[crates.multi]
reconciled = "c2672b6f8"
paths = ["multi/src"]

[crates.security]
# AuthenticationController and what it uses; the rest of security is not ported yet.
reconciled = "e2b7d48aa"
paths = ["security/src"]

[crates.overridable]
reconciled = "e2b7d48aa"
paths = ["commons-mongo/src"]

[crates.ui]
reconciled = "e2b7d48aa"
paths = ["ui/src"]

[crates.core]
# core-exec, core-scheduler, core-events; appdata and connections are listed separately too.
reconciled = "e2b7d48aa"
paths = ["core/src", "commons-core/src", "worker/src"]

[crates.appdata]
reconciled = "e2b7d48aa"
paths = [
  "commons-core/src/main/java/com/fincity/saas/commons/core/service/connection/appdata",
  "commons-core/src/test/java/com/fincity/saas/commons/core/service/connection/appdata",
]

[crates.connections]
reconciled = "e2b7d48aa"
paths = [
  "commons-core/src/main/java/com/fincity/saas/commons/core/service/connection",
  "commons-core/src/main/java/com/fincity/saas/commons/core/service/notification",
  "commons-core/src/main/java/com/fincity/saas/commons/core/document/Connection.java",
]

[crates.notification]
# NotificationController, the queue listener, in-app/email/preference services (commons2 is
# listed under files).
reconciled = "3cf6ebc54"
paths = ["notification/src"]

[kirun]
# kirun-java changes that kirun-rust must follow (in the nocode-kirun repo).
reconciled = "9b85d48"
paths = ["kirun-java/src"]
