# The Rust units as docker-compose services, to merge into
# oci-config/scripts/prod/composer/servers/docker-compose.yml at cutover.
# NOT APPLIED ANYWHERE: an example for review. Images are built by CI from deploy/Dockerfile.
#
# Secrets come from an env file kept outside git (/etc/modlix/rust-units.env), holding
# MODLIX__DATABASE__PASSWORD, MODLIX__STORAGE__ACCESS_KEY_ID, MODLIX__STORAGE__SECRET_ACCESS_KEY,
# MODLIX__REDIS__URL, and for security-auth MODLIX__JWT__KEY, MODLIX__MQ__URI and
# MODLIX__SMS__TWO_FACTOR_API_KEY. Units with different database users need their own env file.

x-rust-unit: &rust-unit
  restart: unless-stopped
  pull_policy: always
  logging:
    driver: json-file
    options:
      max-size: '50m'
      max-file: '3'
  env_file: /etc/modlix/rust-units.env

services:
  # Replaces gateway-server; nginx keeps sending /api/ to :8080.
  gateway-rust:
    <<: *rust-unit
    container_name: gateway-rust
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-gateway-rust:latest
    mem_limit: 256m
    environment:
      MODLIX__TELEMETRY__INSTANCE: gateway-rust
    volumes:
      - '/etc/modlix/gateway-rust.toml:/etc/modlix/gateway-rust.toml:ro'
    ports:
      - '8080:8080'

  files-serve-1: &files-serve
    <<: *rust-unit
    container_name: files-serve-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-files-serve:latest
    mem_limit: 512m
    environment:
      MODLIX__TELEMETRY__INSTANCE: files-serve-1
    volumes:
      - '/etc/modlix/files-serve.toml:/etc/modlix/files-serve.toml:ro'
      - 'files-cache-1:/var/cache/files'
  files-serve-2:
    <<: *files-serve
    container_name: files-serve-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: files-serve-2
    volumes:
      - '/etc/modlix/files-serve.toml:/etc/modlix/files-serve.toml:ro'
      - 'files-cache-2:/var/cache/files'

  files-manage-1: &files-manage
    <<: *rust-unit
    container_name: files-manage-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-files-manage:latest
    mem_limit: 1g
    environment:
      MODLIX__TELEMETRY__INSTANCE: files-manage-1
      # Eureka advertises this address to Java Feign callers.
      MODLIX__EUREKA__INSTANCE_IP: files-manage-1
    volumes:
      - '/etc/modlix/files-manage.toml:/etc/modlix/files-manage.toml:ro'
  files-manage-2:
    <<: *files-manage
    container_name: files-manage-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: files-manage-2
      MODLIX__EUREKA__INSTANCE_IP: files-manage-2

  multi-1: &multi
    <<: *rust-unit
    container_name: multi-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-multi:latest
    mem_limit: 256m
    environment:
      MODLIX__TELEMETRY__INSTANCE: multi-1
    volumes:
      - '/etc/modlix/multi.toml:/etc/modlix/multi.toml:ro'
  multi-2:
    <<: *multi
    container_name: multi-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: multi-2

  # security's AuthenticationController; Java security keeps everything else.
  security-auth-1: &security-auth
    <<: *rust-unit
    container_name: security-auth-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-security-auth:latest
    mem_limit: 256m
    environment:
      MODLIX__TELEMETRY__INSTANCE: security-auth-1
    volumes:
      - '/etc/modlix/security-auth.toml:/etc/modlix/security-auth.toml:ro'
  security-auth-2:
    <<: *security-auth
    container_name: security-auth-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: security-auth-2

  # The rest of the ui that is not the editor: index pages, URI path routes, analytics, caches.
  ui-shell-1: &ui-shell
    <<: *rust-unit
    container_name: ui-shell-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-ui-shell:latest
    mem_limit: 512m
    environment:
      MODLIX__TELEMETRY__INSTANCE: ui-shell-1
    volumes:
      - '/etc/modlix/ui-shell.toml:/etc/modlix/ui-shell.toml:ro'
  ui-shell-2:
    <<: *ui-shell
    container_name: ui-shell-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: ui-shell-2

  # The ui editor (CRUD, drafts, publish, versions, transports, mobile apps). Low traffic.
  ui-editor-1: &ui-editor
    <<: *rust-unit
    container_name: ui-editor-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-ui-editor:latest
    mem_limit: 512m
    environment:
      MODLIX__TELEMETRY__INSTANCE: ui-editor-1
    volumes:
      - '/etc/modlix/ui-editor.toml:/etc/modlix/ui-editor.toml:ro'
  ui-editor-2:
    <<: *ui-editor
    container_name: ui-editor-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: ui-editor-2

  # Scheduling: decides what is due and publishes it. Two for availability; claims make it safe.
  core-scheduler-1: &core-scheduler
    <<: *rust-unit
    container_name: core-scheduler-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-core-scheduler:latest
    mem_limit: 256m
    environment:
      MODLIX__TELEMETRY__INSTANCE: core-scheduler-1
      # KIRun date output follows the process locale and zone, as Java's does: set both to what
      # the Java core JVM uses (java -XshowSettings:properties: user.language/user.country,
      # user.timezone) so server functions keep returning the same dates.
      KIRUN_LOCALE: "<Java core JVM locale, e.g. en_US>"
      TZ: "<Java core JVM zone, e.g. UTC>"
    volumes:
      - '/etc/modlix/core-scheduler.toml:/etc/modlix/core-scheduler.toml:ro'
  core-scheduler-2:
    <<: *core-scheduler
    container_name: core-scheduler-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: core-scheduler-2

  # The events queue consumers: scale this pool with queue depth.
  core-events-1: &core-events
    <<: *rust-unit
    container_name: core-events-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-core-events:latest
    mem_limit: 1g
    environment:
      MODLIX__TELEMETRY__INSTANCE: core-events-1
      # KIRun date output follows the process locale and zone, as Java's does: set both to what
      # the Java core JVM uses (java -XshowSettings:properties: user.language/user.country,
      # user.timezone) so server functions keep returning the same dates.
      KIRUN_LOCALE: "<Java core JVM locale, e.g. en_US>"
      TZ: "<Java core JVM zone, e.g. UTC>"
    volumes:
      - '/etc/modlix/core-events.toml:/etc/modlix/core-events.toml:ro'
  core-events-2:
    <<: *core-events
    container_name: core-events-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: core-events-2

  # core's editor: CRUD, drafts, publish, versions, transports, index, cache, billing. Low traffic.
  core-editor-1: &core-editor
    <<: *rust-unit
    container_name: core-editor-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-core-editor:latest
    mem_limit: 512m
    environment:
      MODLIX__TELEMETRY__INSTANCE: core-editor-1
      # KIRun date output follows the process locale and zone, as Java's does: set both to what
      # the Java core JVM uses (java -XshowSettings:properties: user.language/user.country,
      # user.timezone) so server functions keep returning the same dates.
      KIRUN_LOCALE: "<Java core JVM locale, e.g. en_US>"
      TZ: "<Java core JVM zone, e.g. UTC>"
    volumes:
      - '/etc/modlix/core-editor.toml:/etc/modlix/core-editor.toml:ro'
  core-editor-2:
    <<: *core-editor
    container_name: core-editor-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: core-editor-2

  # security's /internal/ routes: what other services ask security (98% of its traffic).
  security-internal-1: &security-internal
    <<: *rust-unit
    container_name: security-internal-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-security-internal:latest
    mem_limit: 512m
    environment:
      MODLIX__TELEMETRY__INSTANCE: security-internal-1
    volumes:
      - '/etc/modlix/security-internal.toml:/etc/modlix/security-internal.toml:ro'
  security-internal-2:
    <<: *security-internal
    container_name: security-internal-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: security-internal-2

  # security's admin routes: users, clients, apps, profiles, roles, URLs, SSL, billing.
  security-admin-1: &security-admin
    <<: *rust-unit
    container_name: security-admin-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-security-admin:latest
    mem_limit: 512m
    environment:
      MODLIX__TELEMETRY__INSTANCE: security-admin-1
    volumes:
      - '/etc/modlix/security-admin.toml:/etc/modlix/security-admin.toml:ro'
  security-admin-2:
    <<: *security-admin
    container_name: security-admin-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: security-admin-2

  ui-engine-1: &ui-engine
    <<: *rust-unit
    container_name: ui-engine-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-ui-engine:latest
    mem_limit: 512m
    environment:
      MODLIX__TELEMETRY__INSTANCE: ui-engine-1
    volumes:
      - '/etc/modlix/ui-engine.toml:/etc/modlix/ui-engine.toml:ro'
  ui-engine-2:
    <<: *ui-engine
    container_name: ui-engine-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: ui-engine-2
  ui-engine-3:
    <<: *ui-engine
    container_name: ui-engine-3
    environment:
      MODLIX__TELEMETRY__INSTANCE: ui-engine-3
  core-exec-1: &core-exec
    <<: *rust-unit
    container_name: core-exec-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-core-exec:latest
    mem_limit: 1g
    environment:
      MODLIX__TELEMETRY__INSTANCE: core-exec-1
      # KIRun date output follows the process locale and zone, as Java's does: set both to what
      # the Java core JVM uses (java -XshowSettings:properties: user.language/user.country,
      # user.timezone) so server functions keep returning the same dates.
      KIRUN_LOCALE: "<Java core JVM locale, e.g. en_US>"
      TZ: "<Java core JVM zone, e.g. UTC>"
    volumes:
      - '/etc/modlix/core-exec.toml:/etc/modlix/core-exec.toml:ro'
  core-exec-2:
    <<: *core-exec
    container_name: core-exec-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: core-exec-2
  core-exec-3:
    <<: *core-exec
    container_name: core-exec-3
    environment:
      MODLIX__TELEMETRY__INSTANCE: core-exec-3

  # notification: /api/notification (SSE in-app streams, preferences) and the notifications1..3
  # consumer. Replaces notification-server-blue/green; stop those first (crates/notification/DIFFERENCES.md).
  # Its database user differs from the shared env file's: MODLIX__DATABASE__PASSWORD (and
  # MODLIX__MQ__URI) come from its own env file.
  notification-1: &notification
    <<: *rust-unit
    container_name: notification-1
    image: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky/prod-notification:latest
    mem_limit: 256m
    env_file: /etc/modlix/notification.env
    environment:
      MODLIX__TELEMETRY__INSTANCE: notification-1
    volumes:
      - '/etc/modlix/notification.toml:/etc/modlix/notification.toml:ro'
  notification-2:
    <<: *notification
    container_name: notification-2
    environment:
      MODLIX__TELEMETRY__INSTANCE: notification-2

volumes:
  files-cache-1:
  files-cache-2:
