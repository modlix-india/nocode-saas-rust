<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Office fonts a builder's Word template names, mapped to metric-compatible free fonts so a
     converted agreement keeps (nearly) Word's page breaks. A font embedded in the .docx wins. -->
<fontconfig>
  <alias binding="same"><family>Bookman Old Style</family><accept><family>URW Bookman</family></accept></alias>
  <alias binding="same"><family>Century Schoolbook</family><accept><family>C059</family></accept></alias>
  <alias binding="same"><family>Book Antiqua</family><accept><family>P052</family></accept></alias>
  <alias binding="same"><family>Palatino Linotype</family><accept><family>P052</family></accept></alias>
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
</fontconfig>
