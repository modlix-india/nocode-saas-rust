# gateway-rust in production, next to the Java services in the same docker-compose project.
# Replaces gateway-server on :8080 (nginx keeps proxying /api/ to :8080 unchanged).
#
# Pools list every blue/green container of a service. Only the live colour answers; health
# checks take the stopped one out within a few seconds, so keepup's colour flip needs no
# gateway change. NOT APPLIED ANYWHERE: an example for review.

[server]
port = 8080
shutdown_grace_seconds = 10

[telemetry]
log_format = "json"
log_level = "info"
environment = "production"
# otlp_endpoint = "http://alloy:4318"

[redis]
# url comes from MODLIX__REDIS__URL (secret)
cache_prefix = "cmn"

[security]
# security-admin: every security route that is neither auth nor internal.
upstream = ["http://security-admin-1:8113", "http://security-admin-2:8113"]
# The service-to-service routes (clients/internal, users/internal, ...) run in security-internal.
internal_upstream = ["http://security-internal-1:8112", "http://security-internal-2:8112"]

[proxy]
response_timeout_seconds = 3600

[pools.security]
upstreams = ["http://security-server-blue:8001", "http://security-server-green:8001"]
health_path = "/actuator/health"

[pools.core]
upstreams = ["http://core-server-blue:8005", "http://core-server-blue-2:8005", "http://core-server-green:8005", "http://core-server-green-2:8005"]
health_path = "/actuator/health"

[pools.ui]
upstreams = ["http://ui-server-blue:8002", "http://ui-server-blue-2:8002", "http://ui-server-green:8002", "http://ui-server-green-2:8002"]
health_path = "/actuator/health"

[pools.multi]
upstreams = ["http://multi-1:8110", "http://multi-2:8110"]
health_path = "/readyz"

[pools.entity-processor]
upstreams = ["http://entity-processor-blue:8009", "http://entity-processor-blue-2:8009", "http://entity-processor-green:8009", "http://entity-processor-green-2:8009"]
health_path = "/actuator/health"

[pools.message]
upstreams = ["http://message-server-blue:8010", "http://message-server-green:8010"]
health_path = "/actuator/health"

[pools.notification]
# Rust notification. Stop the Java notification containers first: both would consume the
# same notifications1..3 queues.
upstreams = ["http://notification-1:8114", "http://notification-2:8114"]
health_path = "/readyz"

[pools.worker]
upstreams = ["http://worker-server-blue:8011", "http://worker-server-green:8011"]
health_path = "/actuator/health"

[pools.ai]
upstreams = ["http://ai-server-blue:5001", "http://ai-server-green:5001"]
health_path = "/health"

# The Rust units.
[pools.files-serve]
upstreams = ["http://files-serve-1:8103", "http://files-serve-2:8103"]
health_path = "/readyz"

[pools.ui-engine]
upstreams = ["http://ui-engine-1:8102", "http://ui-engine-2:8102", "http://ui-engine-3:8102"]
health_path = "/readyz"

[pools.core-exec]
upstreams = ["http://core-exec-1:8105", "http://core-exec-2:8105", "http://core-exec-3:8105"]
health_path = "/readyz"

[pools.files-manage]
upstreams = ["http://files-manage-1:8104", "http://files-manage-2:8104"]
health_path = "/readyz"

[[routes]]
id = "files-read"
prefix = "/api/files"
contains = ["/api/files/static/file/", "/api/files/secured/file/", "/api/files/secured/downloadFileByKey/"]
methods = ["GET", "HEAD"]
pool = "files-serve"

[[routes]]
id = "files"
prefix = "/api/files"
pool = "files-manage"

