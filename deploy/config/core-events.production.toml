# core-events in production: consumes events1..3 and runs the EventAction tasks (scheduled
# ticks and CreateEvent alike), writes event runs, closes schedule runs. Scale this pool with
# queue depth. NOT APPLIED ANYWHERE: an example for review. Cutover order: crates/core/NEEDS.md.
# Secrets: MODLIX__MONGO__URI, MODLIX__DATABASE__PASSWORD, MODLIX__REDIS__URL, MODLIX__MQ__URI
# (or MODLIX__MQ__PASSWORD), the AI and mail keys the functions use.

[server]
port = 8109

[telemetry]
log_format = "json"
environment = "production"

[mongo]
database = "core"

[database]
host = "prod-mysql.sub10150624021.modlixvcn.oraclevcn.com"
port = 3306
database = "core"
username = "core"
max_connections = 16

[redis]
cache_prefix = "cmn"

[security]
# security-admin: every security route that is neither auth nor internal.
upstream = ["http://security-admin-1:8113", "http://security-admin-2:8113"]
# AuthenticationController (the caller context on every request) runs in security-auth.
auth_upstream = ["http://security-auth-1:8101", "http://security-auth-2:8101"]
# The service-to-service routes (clients/internal, users/internal, ...) run in security-internal.
internal_upstream = ["http://security-internal-1:8112", "http://security-internal-2:8112"]

[entity_processor]
upstream = ["http://entity-processor-blue:8009", "http://entity-processor-blue-2:8009", "http://entity-processor-green:8009", "http://entity-processor-green-2:8009"]

[message]
upstream = ["http://message-server-blue:8010", "http://message-server-green:8010"]   # check the real names

[files]
upstream = ["http://files-manage-1:8104", "http://files-manage-2:8104"]

[ui]
# CoreServices.Platform.CleanupTransports(service=ui): ui-editor serves it.
upstream = ["http://ui-editor-1:8107", "http://ui-editor-2:8107"]

[core]
function_timeout_seconds = 300
java_zone_offset = "+00:00"
# The platform jobs' core calls (internal/billing meter and reconcile, transports, eventRuns and
# events/internal cleanups): core-editor serves all of them.
upstream = ["http://core-editor-1:8111", "http://core-editor-2:8111"]

[mq]
events_exchange = "events"
events_routing_keys = "events1,events2,events3"

[events]
queues = "events1,events2,events3"
prefetch = 16
declare = false
