# core-editor in production: core's editor (CRUD, drafts, publish, versions, transports, index,
# cache, internal billing) and the event routes the platform jobs call. NOT APPLIED ANYWHERE: an example for review.
# Secrets: MODLIX__MONGO__URI, MODLIX__DATABASE__PASSWORD, MODLIX__REDIS__URL.

[server]
port = 8111

[telemetry]
log_format = "json"
environment = "production"

[mongo]
database = "core"

[database]
host = "prod-mysql.sub10150624021.modlixvcn.oraclevcn.com"
port = 3306
database = "core"
username = "core"
max_connections = 16

[redis]
cache_prefix = "cmn"
eviction_channel = "evictionChannel"

[security]
# security-admin: every security route that is neither auth nor internal.
upstream = ["http://security-admin-1:8113", "http://security-admin-2:8113"]
# AuthenticationController (the caller context on every request) runs in security-auth.
auth_upstream = ["http://security-auth-1:8101", "http://security-auth-2:8101"]
# The service-to-service routes (clients/internal, users/internal, ...) run in security-internal.
internal_upstream = ["http://security-internal-1:8112", "http://security-internal-2:8112"]

[entity_processor]
upstream = ["http://entity-processor-blue:8009", "http://entity-processor-blue-2:8009", "http://entity-processor-green:8009", "http://entity-processor-green-2:8009"]

[core]
function_timeout_seconds = 300
java_zone_offset = "+00:00"
