# ui-editor in production: the ui editor (applications, pages, styles, themes, functions,
# schemas, URI paths, filler, transports, versions, publish, DELETE /api/ui, mobile apps).
# gateway-rust sends it the editor routes; Rust multi calls it for index and transports.
# NOT APPLIED ANYWHERE: an example for review.
# Secrets: MODLIX__MONGO__URI, MODLIX__REDIS__URL, and for iOS builds the App Store Connect key
# (MODLIX__EDITOR__APPLE_API_KEY_CONTENT plus its key and issuer ids).

[server]
port = 8107

[telemetry]
log_format = "json"
environment = "production"

[redis]
cache_prefix = "cmn"
eviction_channel = "evictionChannel"

[security]
# security-admin: every security route that is neither auth nor internal.
upstream = ["http://security-admin-1:8113", "http://security-admin-2:8113"]
# AuthenticationController (the caller context on every request) runs in security-auth.
auth_upstream = ["http://security-auth-1:8101", "http://security-auth-2:8101"]
# The service-to-service routes (clients/internal, users/internal, ...) run in security-internal.
internal_upstream = ["http://security-internal-1:8112", "http://security-internal-2:8112"]

[mongo]
max_pool_size = 32

[ui]
resource_cache_age = 604800
java_zone_offset = "+00:00"

[editor]
# Copy from the production Java ui config (security.appCodeSuffix, ui.apple.*) before applying.
app_code_suffix = "<security.appCodeSuffix>"
ssr_channel = "ssr:cache:invalidation"
apple_bundle_id_prefix = "<ui.apple.bundleIdPrefix>"
