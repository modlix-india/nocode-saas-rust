text = "Your session has expired. Please sign in again."
java = "token_expired"
when = "Not raised by the Rust units (kept for the Java bundle's mapping)."
audience = "anyone"

[MULTI.UNKNOWN_TOKEN]
status = 401
text = "Your sign-in is no longer valid. Please sign in again."
java = "unknown_token"
when = "Not raised by the Rust units (kept for the Java bundle's mapping)."
audience = "anyone"

[MULTI.ALREADY_EXISTS]
status = 409
params = ["what:entity", "name"]
