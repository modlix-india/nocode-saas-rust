[package]
name = "lighthouse-client"
description = "Lighthouse's wire types (Eureka InstanceInfo and Applications in Jackson's JSON and in XML, peer replication) and the small client: readiness-gated registration and the registry watch."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# No dependency on platform or on the server: platform and the gateway depend on this crate.
[dependencies]
anyhow.workspace = true
indexmap = { workspace = true, features = ["serde"] }
local-ip-address.workspace = true
metrics.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
