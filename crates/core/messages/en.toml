# Core service messages, English (codes CORE.*): the errors of core-exec, core-editor,
# core-events and core-scheduler, and of the libraries they run (appdata: the storage engines;
# connections: REST, e-mail, AI, tokens). Every key of the Java core bundle
# (core/src/main/resources/messages_en.properties, 79 keys) has a code here, named after it,
# plus the refusals Java raises with a literal text (`java_text`, `$` for each value).
# `params` names Java's `$` values in order.
#
# Rules: what happened, on what, why; what to do next in `action`; names rather than codes;
# anonymous callers learn nothing about the objects they ask for, and signed-in callers never
# learn whether another organisation's object exists (the 404 and 403 answers stay as Java
# sends them). Java's text stays in debugMessage. Format: platform::messages::catalogue.

# ---- Running functions ----

[CORE.FUNCTION_NOT_FOUND]
status = 404
params = ["what", "function"]
text = "We couldn't find the function[ {function}]."
action = "Check the function's namespace and name, and that it is saved in this app."
java = "object_not_found"
when = "Running a function (the execute routes, an event's CALL_CORE_FUNCTION task, a step that names a function) that no repository of the app has."
audience = "anyone"

[CORE.FUNCTION_NO_RESULT]
status = 404
params = ["what", "function"]
text = "The function[ {function}] found nothing to answer with."
action = "Check the values given to it (ids, codes)."
java = "object_not_found"
when = "A CoreServices.Security function whose call to security answers with nothing."
audience = "anyone"

[CORE.FORBIDDEN_EXECUTION]
status = 403
params = ["authorization", "function"]
text = "You can't run [the function {function}|this function]: it needs a permission your account does not have."
action = "Sign in with an account that has it, or ask an owner of your organisation for it."
java = "forbidden_execution"
when = "Running a function whose execution authorization the caller's permissions do not meet."
audience = "anyone"

[CORE.EMPTY_FUNCTION_RESPONSE]
status = 500
params = ["function"]
text = "The function[ {function}] gave no answer."
action = "Try again in a moment. If it keeps happening, give support the error id {errorId}."
java = "empty_function_response"
when = "A function served by entity-processor (a remote repository) answers with nothing."
audience = "anyone"

[CORE.FUNCTION_TIMED_OUT]
status = 500
params = ["function"]
text = "The function[ {function}] took too long and was stopped."
action = "Try again later. If it keeps happening, make the function do less in one run."
java_text = "Function execution timed out : $. Please try again later."
when = "A stored function runs longer than the time core allows one run."
audience = "anyone"

[CORE.FUNCTION_STEP_FAILED]
status = 500
params = ["step", "stepFunction", "function", "reason"]
text = "[Step {step}|A step][ ({stepFunction})][ in {function}] failed[: {reason}]."
action = "Check what that step is given. If it keeps happening, give support the error id {errorId}."
java_text = "Please try again. A server error - $"
when = "A server function fails inside one of its steps (a value that does not fit a step's parameter, an expression that cannot be worked out, a function a step calls that fails). The step is the innermost one that failed; the whole chain is in debugMessage."
audience = "anyone"

[CORE.FUNCTION_FAILED]
status = 500
params = ["function", "reason"]
text = "The function[ {function}] failed[: {reason}]."
action = "Check the values given to the function. If it keeps happening, give support the error id {errorId}."
java_text = "Please try again. A server error - $"
when = "A function fails where no step accounts for it (a system function given a value that does not fit, a function with no steps)."
audience = "anyone"

[CORE.UNABLE_TO_EXECUTE]
status = 500
params = ["name", "namespace", "parameters"]
text = "The event's task names no function to run."
action = "Set the namespace and name of the function in the event action's task."
java = "unable_to_execute"
when = "An event action's CALL_CORE_FUNCTION task without a function namespace or name (core-events; kept in the event run log)."
audience = "developers"

[CORE.SERVER_FUNCTION_ONLY]
status = 403
params = ["function"]
text = "[{function}|This function] can only be used inside a server function."
action = "Call it from a step of a server function."
java_text = "$ can only be called from a server function"
when = "A security or messaging function of core called directly (the execute address, a page) instead of from a server function's step."
audience = "anyone"

[CORE.SECURITY_CONTEXT_MISSING]
status = 403
params = ["function"]
text = "[{function}|This function] can only run while serving a request."
action = "Run it from a function a page or an address calls, not from an event or a schedule."
java_text = "$ needs a security context"
when = "A security function of core running with no request (an event or a schedule)."
audience = "anyone"

[CORE.SIGNED_IN_USER_REQUIRED]
status = 403
params = ["function"]
text = "[{function}|This function] needs a signed-in user."
action = "Sign in and try again."
java_text = "$ needs a signed in user"
when = "A function that acts as the caller (CoreServices.Security user and client changes) run by an anonymous caller."
audience = "anyone"

[CORE.CALLER_TOKEN_MISSING]
status = 403
params = ["function"]
text = "[{function}|This function] has no sign-in to act with."
action = "Sign in again and try again."
java_text = "$ has no caller token to act with"
when = "A function that acts as the caller run for a signed-in caller whose request carries no token."
audience = "signed-in"

[CORE.CALLER_REQUEST_REQUIRED]
status = 403
params = ["function"]
text = "[{function}|This function] acts for the signed-in user, so it can only run while serving their request."
action = "Run it from a function a page calls, not from an event, a schedule or an internal call."
java_text = "$ acts only inside a caller's request; this execution (an event, a schedule or an internal call) has no request to act as"
when = "A function that acts as the caller run outside a caller's request."
audience = "signed-in"

[CORE.PLATFORM_FUNCTION_REFUSED]
status = 403
params = ["function"]
text = "[{function}|This function] runs only as a task of the platform app's events."
java_text = "$ runs only as a task of the platform app's events"
when = "A CoreServices.Platform function called from anywhere but a core-events task of the platform app (SYSTEM)."
audience = "anyone"

[CORE.PLATFORM_PARTIAL_FAILURE]
status = 502
params = ["function", "errors", "result"]
text = "Some of the calls[ of {function}] failed[: {errors}]."
action = "Try again in a moment. The calls that worked are listed in debugMessage."
java_text = "$: $ (result: $)"
when = "A CoreServices.Platform function whose independent calls to the services did not all succeed."
audience = "developers"

[CORE.PLATFORM_ARGUMENT_INVALID]
status = 400
params = ["function", "argument", "expected"]
text = "[The argument {argument}[ of {function}] is not valid|An argument is not valid][: it should be {expected}]."
action = "Correct [{argument}|the argument] in the event action's task and try again."
java_text = ["$.Meter has no service '$'. Expected security, core, entity-processor or files.", "$.CleanupTransports has no 'service'. Expected 'ui' or 'core'.", "Unknown service in transport cleanup: '$'. Expected 'ui' or 'core'."]
when = "A CoreServices.Platform function given a service it does not know."
audience = "developers"

# ---- Function arguments ----

[CORE.ARGUMENT_REQUIRED]
status = 400
params = ["argument"]
text = "[The argument {argument} is missing.|A required argument is missing.]"
action = "Pass [{argument}|it] to the function and try again."
java_text = "$ is required"
when = "A security, messaging or schedule function of core called without a value it needs (clientId, userId, appCode, to...)."
audience = "anyone"

[CORE.ARGUMENT_INVALID]
status = 400
params = ["argument", "expected"]
text = "[The argument {argument} is not valid[: it should be {expected}].|An argument is not valid[: it should be {expected}].]"
action = "Correct [{argument}|the argument] and try again."
java_text = ["$ must be a number or a numeric string", "$ is not an id : $", "$ must be an object", "status must be ACTIVE or INACTIVE"]
when = "A security function of core given a value of the wrong kind (an id that is not a whole number, a status that is not ACTIVE or INACTIVE)."
audience = "anyone"

[CORE.CONDITION_INVALID]
status = 400
text = "The filter condition is not valid."
action = "Give each condition a field and a value, or sub-conditions."
java_text = "Invalid condition"
when = "A storage function (CoreServices.Storage.ReadPage, DeleteByFilter...) or a user query of CoreServices.Security given a filter condition with neither a field nor an expression."
audience = "anyone"

[CORE.HASH_ALGORITHM_MISSING]
status = 400
text = "No hash algorithm was given."
action = "Pass an algorithm such as SHA-256."
java_text = "Algorithm cannot be null or empty"
when = "CoreServices.Hash called without an algorithm."
audience = "anyone"

[CORE.HASH_ALGORITHM_UNSUPPORTED]
status = 400
params = ["algorithm"]
text = "The hash algorithm[ {algorithm}] is not supported."
action = "Use SHA-256, SHA-384, SHA-512, SHA-1, MD5 or MD2."
java_text = "Hash algorithm not supported: $"
when = "CoreServices.Hash called with an algorithm the platform does not have."
audience = "anyone"

[CORE.KEY_TOO_SHORT]
status = 500
params = ["use", "bits", "algorithm"]
text = "The [{use} ]key is too short for [the {algorithm} algorithm|its algorithm][: it has {bits} bits]."
action = "Use a longer key."
java_text = "The $ key's size is $ bits which is not secure enough for the $ algorithm."
when = "CoreServices.Crypto signing or verifying with a key shorter than the algorithm needs."
audience = "anyone"

# ---- Security functions (acting for the caller) ----

[CORE.FORBIDDEN_PERMISSION]
status = 403
params = ["permission:authority"]
text = "[You can't do this: your account does not have {permission}.|You don't have permission to do this.]"
action = "Ask an owner of your organisation to give you [{permission}|the permission you need]."
java = "forbidden_permission"
when = "A CoreServices.Security function refused the way security would refuse it (client managers, client updates and deletes, client activities)."
audience = "signed-in"

[CORE.FORBIDDEN_CREATE]
status = 403
params = ["what:entity"]
text = "You can't create this {what|item}: you don't manage the organisation it would belong to."
action = "Choose an organisation you manage, or ask an owner of that one."
java = "forbidden_create"
when = "CoreServices.Security.CreateUser for a client the caller does not manage."
audience = "signed-in"

[CORE.USER_UPDATE_FORBIDDEN]
status = 403
text = "You can't change this user: you don't manage the organisation they belong to."
action = "Ask an owner of that organisation."
java_text = "Cannot update user for the selected client"
when = "CoreServices.Security.UpdateUser or DeleteUser for a user of a client the caller does not manage."
audience = "signed-in"

[CORE.USER_STATUS_FORBIDDEN]
status = 403
text = "You can't change whether this user is active."
action = "Ask an owner of the user's organisation."
java_text = "selected user doesn't have access to change status code"
when = "CoreServices.Security.SetUserStatus for a user the caller does not manage."
audience = "signed-in"

[CORE.CLIENT_STATUS_FORBIDDEN]
status = 403
text = "You can't change whether this organisation is active."
action = "Ask an owner of the organisation that manages it."
java_text = "selected client doesn't have access to change status code"
when = "CoreServices.Security.SetClientStatus for a client the caller does not manage."
audience = "signed-in"

[CORE.PROFILE_FORBIDDEN_FOR_USER]
status = 403
params = ["profile", "user"]
text = "You can't give this profile to this user."
action = "Assign only profiles available to the user's organisation, and only to users you manage."
java_text = "$ profile forbidden for the $ user"
when = "CoreServices.Security.AssignProfile or RemoveProfile for a user the caller does not manage."
audience = "signed-in"

[CORE.OWN_CLIENT_REFUSED]
status = 403
params = ["function", "client"]
text = "[{function}|This function] does not act on your own organisation."
action = "Choose an organisation your organisation manages."
java_text = "$ does not act on the caller's own client $"
when = "A client-changing CoreServices.Security function (status, update, delete) aimed at the caller's own client."
audience = "signed-in"

[CORE.CLIENT_OUT_OF_SCOPE]
status = 403
params = ["function", "client"]
text = "You can't act for [the client {client}|that client]: it is not your organisation or one it manages."
action = "Choose your own organisation or one it manages."
java_text = ["$: client $ is neither the caller's client nor one it manages", "$: client $ is not the caller's client, one it manages or the client that manages it"]
when = "A CoreServices.Security function (user query, client managers, client reads) aimed at a client outside the caller's scope."
audience = "signed-in"

[CORE.APP_NOT_FOUND]
status = 404
params = ["app"]
text = "We couldn't find the app[ {app}]."
action = "Check the app's code."
java_text = "No app found with code : $"
when = "CoreServices.Security.GetAppProfiles for an app code security does not know."
audience = "signed-in"

[CORE.USER_NOT_FOUND]
status = 400
params = ["id"]
text = "We couldn't find the user[ with id {id}]."
action = "Check the user's id."
java_text = "No user found with id : $"
when = "CoreServices.Security.GetUserSubOrg for a user id security does not know."
audience = "signed-in"

[CORE.USER_NOT_RELATED]
status = 403
params = ["user"]
text = "You can't look up this user: they belong to an organisation not related to yours."
java_text = "User $ is not in a client related to the current user's"
when = "CoreServices.Security.GetUserSubOrg for a user of a client unrelated to the caller's."
audience = "signed-in"

[CORE.OTHER_USER_REFUSED]
status = 403
params = ["function"]
text = "[{function}|This function] answers only for the signed-in user."
action = "Leave out userId, or pass your own."
java_text = "GetManagedClientIds answers only for the current user; security exposes no other user's roles"
when = "CoreServices.Security.GetManagedClientIds asked about another user."
audience = "signed-in"

[CORE.CLIENT_NOT_RELATED]
status = 403
params = ["client"]
text = "You can't act for [the client {client}|that client]: it is not related to your organisation."
action = "Choose your own organisation or one related to it."
java_text = ["Client $ is not related to the current user's client", "Not allowed to list the users of client $"]
when = "A CoreServices.Security function (users for distribution, a client's users page) aimed at a client unrelated to the caller's."
audience = "signed-in"

# ---- Messages and schedules ----

[CORE.MESSAGE_SERVICE_RETIRED]
status = 410
params = ["function"]
text = "The function[ {function}] no longer works: the message service it called has been retired."
action = "Send messages and place calls through the app's own server functions and REST connections to the provider."
java_text = "$ called the message service, which has been retired"
when = "Any CoreServices.Message function (SendWhatsapp, MakeCall, the WhatsApp number functions): it fails at once, without calling anything."
audience = "anyone"

[CORE.DATA_NOTIFICATION_EVENT_INVALID]
status = 400
params = ["event"]
text = "The event name[ {event}] can't be used for a data notification: it must be 1 to 64 letters, digits, underscores, dots or hyphens."
action = "Use a short name such as incomingCall or task.changed."
java_text = "Event name '$' must be 1 to 64 letters, digits, '_', '.' or '-'"
when = "CoreServices.Notification.SendDataNotification with an empty event name, one longer than 64 characters, or one with other characters."
audience = "anyone"

[CORE.DATA_NOTIFICATION_EVENT_RESERVED]
status = 400
params = ["event"]
text = "The event name[ {event}] can't be used for a data notification: the notification stream uses it itself."
action = "Pick another name; init and notification are taken."
java_text = "Event name '$' is reserved"
when = "CoreServices.Notification.SendDataNotification with the event name init or notification (in any case)."
audience = "anyone"

[CORE.DATA_NOTIFICATION_TOO_LARGE]
status = 400
params = ["size", "limit"]
text = "The data notification's data is too large[ ({size} bytes)]: at most[ {limit}] bytes can be pushed."
action = "Send less: an id or a short summary the page can read the rest with."
java_text = "Data notification data is $ bytes, more than the $ allowed"
when = "CoreServices.Notification.SendDataNotification whose data, written as JSON, is over 64 KB."
audience = "anyone"

[CORE.WHATSAPP_OWN_CLIENT_ONLY]
status = 403
params = ["own", "client"]
text = "You can manage only your own organisation's WhatsApp numbers."
java_text = "Only client $ may manage its own WhatsApp numbers, not $"
when = "A CoreServices.Message WhatsApp-number function aimed at another client. Not raised by the Rust units since the message service was retired (2026-10-22): those functions answer CORE.MESSAGE_SERVICE_RETIRED."
audience = "signed-in"

[CORE.MESSAGE_APP_FORBIDDEN]
status = 403
params = ["app"]
text = "You can't send messages for the app[ {app}]."
action = "Send messages only for apps your organisation can use."
java_text = "Not allowed to message for app $"
when = "A CoreServices.Message function for an app the caller's client has no access to. Not raised by the Rust units since the message service was retired (2026-10-22): those functions answer CORE.MESSAGE_SERVICE_RETIRED."
audience = "signed-in"

[CORE.MESSAGE_CLIENT_FORBIDDEN]
status = 403
params = ["client"]
text = "You can't send messages for [the client {client}|that client]: it is not your organisation or one it manages."
action = "Send messages only for your organisation or one it manages."
java_text = "Not allowed to message on behalf of client $"
when = "A CoreServices.Message function on behalf of a client the caller's client does not manage. Not raised by the Rust units since the message service was retired (2026-10-22): those functions answer CORE.MESSAGE_SERVICE_RETIRED."
audience = "signed-in"

[CORE.WHATSAPP_NOT_LINKED]
status = 409
params = ["client", "app"]
text = "No WhatsApp number is linked[ for {client}][ in {app}]."
action = "Link a WhatsApp number in the app's messaging settings first."
java_text = "No WhatsApp number is linked for $ in $"
when = "CoreServices.Message.SendWhatsapp for a client with no linked WhatsApp number. Not raised by the Rust units since the message service was retired (2026-10-22): those functions answer CORE.MESSAGE_SERVICE_RETIRED."
audience = "signed-in"

[CORE.SCHEDULE_CLIENT_FORBIDDEN]
status = 403
params = ["client"]
text = "You can't schedule events for [the client {client}|that client]: it is not your organisation or one it manages."
action = "Schedule events only for your organisation or one it manages."
java_text = "Not allowed to schedule events for client $"
when = "A CoreServices.Schedule function for a client the caller's client does not manage."
audience = "signed-in"

[CORE.SCHEDULE_STATE_FORBIDDEN]
status = 403
params = ["client", "app"]
text = "You can read a schedule only for your own organisation, in the app the function runs in[, not for {client}][, not in {app}]."
action = "Leave clientCode and appCode empty to read your own organisation's schedule."
java_text = "Not allowed to read the schedule state for client $ in app $"
when = "CoreServices.Event.GetScheduleState with a clientCode other than the caller's own client, or an appCode other than the app it runs in. Rust only."
audience = "signed-in"

# ---- Storage: who may read and write ----

[CORE.STORAGE_NOT_FOUND]
status = 404
params = ["storage"]
text = "We couldn't find the storage[ {storage}]."
action = "Check the storage's name, and that it is saved in this app."
java = "storage_not_found"
when = "Reading or writing data in a storage the app does not have."
audience = "anyone"

[CORE.FORBIDDEN_CREATE_STORAGE]
status = 403
params = ["storage"]
text = "[You can't add data to {storage}: your account does not have the permission this storage needs for adding data.|You can't add this data without signing in.]"
action = "[Ask an owner of your organisation for the permission to add data to {storage}.|Sign in and try again.]"
java = "forbidden_create_storage"
when = "Adding a row to a storage without the storage's create permission (an anonymous caller is only asked to sign in)."
audience = "anyone"

[CORE.FORBIDDEN_READ_STORAGE]
status = 403
params = ["storage"]
text = "[You can't view the data in {storage}: your account does not have the permission this storage needs for reading.|You can't view this data without signing in.]"
action = "[Ask an owner of your organisation for the permission to view the data in {storage}.|Sign in and try again.]"
java = "forbidden_read_storage"
when = "Reading rows of a storage without the storage's read permission (an anonymous caller is only asked to sign in)."
audience = "anyone"

[CORE.FORBIDDEN_UPDATE_STORAGE]
status = 403
params = ["storage"]
text = "[You can't change the data in {storage}: your account does not have the permission this storage needs for changes.|You can't change this data without signing in.]"
action = "[Ask an owner of your organisation for the permission to change the data in {storage}.|Sign in and try again.]"
java = "forbidden_update_storage"
when = "Changing a row of a storage without the storage's update permission (an anonymous caller is only asked to sign in)."
audience = "anyone"

[CORE.FORBIDDEN_DELETE_STORAGE]
status = 403
params = ["storage"]
text = "[You can't delete data in {storage}: your account does not have the permission this storage needs for deleting.|You can't delete this data without signing in.]"
action = "[Ask an owner of your organisation for the permission to delete data in {storage}.|Sign in and try again.]"
java = "forbidden_delete_storage"
when = "Deleting rows of a storage without the storage's delete permission, or deleting rows that another storage's delete would cascade to (an anonymous caller is only asked to sign in)."
audience = "anyone"

[CORE.CASCADE_DELETE_FORBIDDEN]
status = 403
params = ["storages"]
text = "You can't delete this row: deleting it would also delete rows[ in {storages}], and your account does not have the permission to delete data there."
action = "Ask an owner of your organisation for that permission, or delete the related rows first."
java = "forbidden_delete_storage"
when = "Deleting a row whose cascading relations reach storages the caller may not delete from."
audience = "signed-in"

[CORE.STORAGE_ROW_GONE]
status = 403
params = ["storage"]
text = "We couldn't change the row[ in {storage}]: it is no longer there."
action = "Reload the data and try again."
java = "forbidden_update_storage"
when = "Changing a row of a MySQL storage that was deleted before the change was saved (Java answers it with the update refusal)."
audience = "signed-in"

[CORE.STORAGE_SCHEMA_REF_NOT_FOUND]
status = 404
params = ["schema", "storage"]
text = "We couldn't find the schema[ {schema}] that the storage[ {storage}] takes its fields from."
action = "Check the storage's schema reference, or create that schema in the app."
when = "Reading the fields of a storage (CoreServices.Storage.GetFields) whose schema reference names no schema the client can read."
audience = "signed-in"

[CORE.STORAGE_BUILDER_ONLY]
status = 403
params = ["app"]
text = "Only someone who can edit the app[ {app}] can do this to its data."
action = "Ask an owner of the app for edit access."
java = "forbidden_update_storage"
when = "Copying live data into the draft, or clearing draft data, without write access to the app."
audience = "signed-in"

[CORE.FORBIDDEN_CLIENT_CODE]
status = 403
params = ["client"]
text = "You can't act for [the client {client}|that client]: it is not your organisation or one it manages."
action = "Use your own client code, or one your organisation manages."
java = "forbidden_client_code"
when = "A data call or an event run search naming a client the caller's organisation does not manage (or, for event runs, does not have the app for)."
audience = "signed-in"

[CORE.STORAGE_ONLY_THRU_KIRUN]
status = 403
params = ["storage"]
text = "[The data in {storage} can only be reached through a server function.|This data can only be reached through a server function.]"
action = "Read and change it from a server function of the app."
java = "storage_only_thru_kirun"
when = "Reaching the rows of a storage marked onlyThruKIRun through the data routes, outside a KIRun function and a builder app."
audience = "anyone"

[CORE.FORBIDDEN_EXPLICIT_DRAFT_SURFACE]
status = 403
params = ["app"]
text = "Only someone who can edit the app[ {app}] can choose between its live and draft data."
action = "Leave out the draft choice to use the data this address serves, or ask an owner of the app for edit access."
java = "forbidden_explicit_draft_surface"
when = "A data call naming the live or the draft surface without write access to the app."
audience = "signed-in"

# ---- Storage: rows ----

[CORE.ROW_NOT_FOUND]
status = 404
params = ["storage", "id"]
text = "We couldn't find the row[ {id}][ in {storage}]."
action = "Check the row's id. It may have been deleted."
java = "object_not_found"
when = "Reading, changing or deleting a row (or a version of one) that is not in the storage."
audience = "anyone"

[CORE.VERSION_NOT_FOUND]
status = 404
params = ["storage", "id"]
text = "We couldn't find the version[ {id}] of the row[ in {storage}]."
action = "Check the version's id."
java = "object_not_found"
when = "Reading a version of a row that is not in the storage's version history."
audience = "anyone"

[CORE.OBJECT_NOT_FOUND_TO_UPDATE]
status = 404
params = ["storage", "id"]
text = "We couldn't find the row[ {id}][ in {storage}] to change it."
action = "Check the row's id. It may have been deleted."
java = "object_not_found_to_update"
when = "Changing a row of a Mongo storage that is not there."
audience = "anyone"

[CORE.STORAGE_OBJECT_ID_EXISTS]
status = 409
params = ["id", "storage"]
text = "A row with [id {id}|this id] already exists[ in {storage}]."
action = "Leave out _id to add a new row, or update the existing row instead."
java = "storage_object_id_exists"
when = "Adding a row whose _id is already taken."
audience = "anyone"

[CORE.DUPLICATE_KEY]
status = 409
params = ["storage", "index"]
text = "That is already taken[ ({index})]."
action = "Choose another value, or change the row that already holds it[ in {storage}]."
when = "Adding or changing a row whose value is already held by another row under a unique index (MySQL error 1062, Mongo E11000). Rust only: Java let the driver's error escape as a 500. Storage.Batch with onConflict report answers it as a conflict instead."
audience = "anyone"

[CORE.ROW_ID_REQUIRED]
status = 400
params = ["field"]
text = "The row's id[ ({field})] is needed to change a row."
action = "Put the row's id in the request and try again."
java = "row_id_required"
when = "Changing a MySQL row without its id."
audience = "anyone"

[CORE.FIELD_CANNOT_BE_NULL]
status = 400
