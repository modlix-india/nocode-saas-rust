[UI.CANNOT_BE_UPDATED]
status = 304
params = ["what:entity"]
text = "This {what|item} can't be changed once it is made."
action = "Make a new one instead."
java = "cannot_be_updated"
when = "Not raised by the Rust units (definition errors answer with DEF.CANNOT_BE_UPDATED)."
audience = "signed-in"

[UI.TRANSPORT_ERROR]
status = 403
