audience = "signed-in"

[UI.FORBIDDEN_FORK_NOT_OVERRIDABLE]
status = 403
params = ["what:entity", "name"]
text = "[The {what} {name} can't be customised, so only the organisation that owns it can edit it.|This item can't be customised, so only the organisation that owns it can edit it.]"
action = "Ask the organisation that owns it to make the change."
java = "forbidden_fork_not_overridable"
when = "Not raised by the Rust units (definition errors answer with DEF.FORBIDDEN_FORK_NOT_OVERRIDABLE)."
audience = "signed-in"

[UI.USER_CREDENTIALS_MISMATCHED]
status = 403
text = "The user name or password is not correct."
action = "Check them and try again, or reset your password if you've forgotten it."
java = "user_credentials_mismatched"
