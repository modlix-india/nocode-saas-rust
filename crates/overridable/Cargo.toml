[package]
name = "overridable"
description = "The overridable-document engine of the Java commons-mongo services: inheritance, drafts, the merge down the baseClientCode chain, Java-identical JSON, and the write path (create, update, delete, drafts, versions, publish, transport) with the Java cache evictions."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
platform = { workspace = true, features = ["mongo"] }

anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["multipart"] }
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
indexmap.workspace = true
mongodb.workspace = true
percent-encoding.workspace = true
rand.workspace = true
regex.workspace = true
ryu.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
redis.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
