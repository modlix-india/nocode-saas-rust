# Platform messages, English: the codes every service shares (COMMON), and the label tables
# (PERMISSION, ENTITY, WORD) that turn technical names into words.
#
# Format (see platform::messages::catalogue): one table per code; `text` is what happened and
# why, `action` what to do next. Placeholders: {name}, {name|default}, [optional {name}],
# [when {name}|otherwise]. {errorId} is the response's error id. Only `text` and `action` are
# read from translations (pt.toml, ...) and override files.

# ---- Signed out, permissions ----

[COMMON.SIGNED_OUT]
status = 401
text = "You're signed out. Please sign in again."
java_text = ""
when = "A protected address is called with a token or password that is no longer accepted (expired, revoked, issued for another site)."
audience = "anyone"

[COMMON.SIGN_IN_REQUIRED]
status = 401
text = "Please sign in to continue."
java_text = ["", "Access Denied"]
when = "A protected address is called without signing in."
audience = "anyone"

[COMMON.PERMISSION_REQUIRED]
status = 403
params = ["permission:authority", "app", "client"]
text = "[You can't do this[ in {app}]: your account does not have {permission}.|You don't have permission to do this.]"
action = "Ask an owner of {client|your organisation} to give you [{permission}|the permission you need]."
java_text = ["Access Denied", ""]
when = "A signed-in caller lacks the permission a route requires (@PreAuthorize)."
audience = "signed-in"

[COMMON.FORBIDDEN]
status = 403
text = "You don't have access to this."
action = "If you think you should, ask an owner of your organisation."
java_text = ""
when = "A refusal with nothing more specific to say."
audience = "signed-in"

# ---- Bad input ----

[COMMON.BAD_REQUEST]
status = 400
text = "The request is not valid."
action = "Check what you sent and try again."
java_text = "Please try again. A server error - $"
when = "A request the service cannot use, with nothing more specific to say."
audience = "anyone"

[COMMON.BODY_MISSING]
status = 400
text = "The request has no body."
action = "Send the details as JSON in the request body."
java_text = "Please try again. A server error - $"
when = "A route that needs a JSON body gets none."
audience = "anyone"

[COMMON.BODY_NOT_JSON]
status = 400
text = "The request body must be JSON."
action = "Send it with the header Content-Type: application/json."
java_text = "Please try again. A server error - $"
when = "A body arrives without a JSON content type (415 where Spring answers it)."
audience = "anyone"

[COMMON.BODY_UNREADABLE]
status = 400
text = "The request body is not valid JSON."
action = "Check the request body and try again."
java_text = "Please try again. A server error - $"
when = "The body cannot be read as JSON, or a value in it cannot be converted."
audience = "anyone"

[COMMON.BODY_INVALID]
status = 400
params = ["expected"]
text = "The request body does not have the expected shape[: a value should be {expected}]."
action = "Check the request body and try again."
java_text = "Please try again. A server error - $"
when = "The body is JSON but a value has the wrong type, and the parser did not say which field."
audience = "anyone"

[COMMON.FIELD_MISSING]
status = 400
params = ["field"]
text = "[The field {field} is missing.|A required field is missing.]"
action = "Fill in [{field}|every required field] and try again."
java_text = "Please try again. A server error - $"
when = "A required field of the body is missing."
audience = "anyone"

[COMMON.FIELD_INVALID]
status = 400
params = ["field", "expected"]
text = "[The value of {field} is not valid[: it should be {expected}].|A value in the request is not valid[: it should be {expected}].]"
action = "Correct [{field}|the value] and try again."
java_text = "Please try again. A server error - $"
when = "A field of the body has a value of the wrong type or form."
audience = "anyone"

[COMMON.PARAM_MISSING]
status = 400
params = ["field"]
text = "[The request is missing the {field} parameter.|The request is missing a required parameter.]"
action = "Add [{field}|the parameter] to the request and try again."
java_text = "Please try again. A server error - $"
when = "A required query parameter is not sent."
audience = "anyone"

[COMMON.HEADER_MISSING]
status = 400
params = ["field"]
text = "[The request is missing the {field} header.|The request is missing a required header.]"
action = "Send the request through the gateway, which adds it, or add [{field}|the header] and try again."
java_text = "Please try again. A server error - $"
when = "A route that needs a header (appCode, clientCode, X-Forwarded-Host...) is called without it."
audience = "developers"

[COMMON.PARAM_INVALID]
status = 400
params = ["field", "expected"]
text = "[The value of the {field} parameter is not valid[: it should be {expected}].|A parameter of the request is not valid[: it should be {expected}].]"
action = "Correct [{field}|the parameter] and try again."
java_text = "Please try again. A server error - $"
when = "A query or path parameter does not convert (an id that is not a number, a list written with commas...)."
audience = "anyone"

[COMMON.METHOD_NOT_ALLOWED]
status = 405
params = ["method"]
text = "This address does not accept [{method} requests|this kind of request]."
java_text = "Please try again. A server error - $"
when = "A route is called with an HTTP method it does not have."
audience = "anyone"

[COMMON.PAYLOAD_TOO_LARGE]
status = 413
text = "The request is too large."
action = "Send less at once and try again."
java_text = "Please try again. A server error - $"
when = "The body is larger than the service accepts."
audience = "anyone"

[COMMON.NOT_FOUND]
status = 404
text = "We couldn't find what you asked for."
action = "Check the address and try again."
java_text = "Please try again. A server error - $"
when = "Nothing answers to the address."
audience = "anyone"

# ---- Our side ----

[COMMON.INTERNAL_ERROR]
status = 500
text = "Something went wrong on our side. Error id {errorId}: give it to support."
action = "Try again in a moment."
java_text = "Please try again. A server error - $"
when = "An unexpected failure inside the service. The detail is logged with the error id."
audience = "anyone"

[COMMON.ERROR]
status = 500
text = "Your request could not be completed."
action = "Try again in a moment. If it keeps happening, give support the error id {errorId}."
when = "A code that has no text in any language (never expected; the catalogue tests prevent it)."
audience = "anyone"

