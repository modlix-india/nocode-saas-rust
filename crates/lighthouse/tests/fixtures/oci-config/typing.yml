# Synthetic fixture: YAML typing and shapes only the Spring compat endpoint reads (app "typing").
plain: hello world
ints: [0, 7, -7, +12, 010, 0o17, 0x1F, 0b101, 1_000, 1:30, 190:20:30, 9223372036854775807, 9223372036854775808]
floats: [1.0, -2.5, 1e5, 1.5e+3, .5, 6.02e23, 100000000.0, 0.0001, .inf, -.Inf, .NaN, 1_000.5]
bools: [yes, No, ON, off, true, False, y, n]
nulls: [~, null, Null, ""]
dates: [2024-01-02, 2024-01-02T03:04:05Z]
