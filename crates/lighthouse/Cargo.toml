[package]
name = "lighthouse"
description = "Lighthouse: the registry (Eureka's API, peer replication, eviction with self-preservation) that replaces the Java Eureka server, and the config server (oci-config snapshots, Spring Cloud Config's endpoint, the Rust units' documents and the ai and ssr env files) that replaces the Java config server and tools/render_config.py."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "lighthouse"
path = "src/bin/lighthouse.rs"

[dependencies]
platform.workspace = true
lighthouse-client.workspace = true

anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
base64 = "0.22"
bytes.workspace = true
flate2 = "1"
futures.workspace = true
hex.workspace = true
indexmap.workspace = true
metrics.workspace = true
parking_lot.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
tar = "0.4"
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
yaml-rust2 = "0.13"

[dev-dependencies]
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { workspace = true, features = ["util"] }
