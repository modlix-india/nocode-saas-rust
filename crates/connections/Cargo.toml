[package]
name = "connections"
description = "core's outbound integrations as a library: connection documents, REST calls (basic, OAuth2, auth-function tokens) behind the private-target guard, email (SMTP, SendGrid) with template rendering, AI chat, and the RabbitMQ event and notification publishers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
platform.workspace = true

anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
bytes.workspace = true
chrono.workspace = true
flate2 = "1"
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
lapin = "4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
parking_lot.workspace = true
percent-encoding.workspace = true
rand.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
regex.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
