when = "Not raised by the Rust units (kept for the Java bundle's mapping)."
audience = "anyone"

[SEC.MISSING_PASSWORD]
status = 400
text = "A user needs a password."
java = "missing_password"
when = "Not raised by the Rust units (kept for the Java bundle's mapping)."
audience = "signed-in"

[SEC.MAIL_CANNOT_BE_TRIGGERED]
status = 400
text = "We couldn't send the email to this user."
java = "mail_cannot_be_triggered"
when = "Not raised by the Rust units (kept for the Java bundle's mapping)."
audience = "signed-in"

# ---- Objects ----

[SEC.OBJECT_NOT_FOUND]
status = 404
params = ["what:entity", "id"]
text = "We couldn't find the {what|item}[ with id {id}]."
action = "Check that it still exists and that you are looking in the right organisation."
java = "object_not_found"
when = "Reading or changing an object that does not exist or is not visible to the caller (the same answer for both)."
audience = "signed-in"

[SEC.OBJECT_NOT_FOUND_TO_UPDATE]
status = 404
params = ["what:entity", "id"]
text = "We couldn't find the {what|item}[ with id {id}] to change it."
action = "Check that it still exists and that you can manage it."
java = "object_not_found_to_update"
when = "Changing an app access that does not exist or is not visible."
audience = "signed-in"

[SEC.PARAMS_NOT_FOUND]
status = 400
params = ["params", "target"]
text = "[The request is missing, or has a wrong value for, {params}[ ({target})].|The request is missing some required details.]"
action = "Check [{params}|the request] and try again."
java = "params_not_found"
when = "A required value is missing or out of range (manager lists, billing token counts)."
audience = "signed-in"

[SEC.NAME_MANDATORY]
status = 400
params = ["what:entity"]
text = "The {what|item} needs a name."
action = "Enter a name and try again."
java = "name_mandatory"
when = "Creating a profile, designation, department or activity without a name."
audience = "signed-in"

[SEC.NAME_TAKEN]
status = 409
params = ["what:entity", "name"]
text = "[A {what|item} named {name} already exists.|An item with this name already exists.]"
action = "Choose another name."
java = "name_taken"
when = "Creating or renaming a profile, designation or department to a name the organisation has."
audience = "signed-in"

[SEC.FIELD_NOT_UPDATABLE]
status = 400
params = ["field"]
text = "[The field {field} can't be changed.|This field can't be changed.]"
action = "Leave it out of the request and try again."
java_text = "$ field cannot be updated, it might not be available or unmodifiable"
when = "A PATCH naming a field that does not exist or cannot take the value."
audience = "signed-in"

[SEC.UNKNOWN_ERROR]
status = 500
text = "We couldn't complete the request."
action = "Try again in a moment. If it keeps happening, give support the error id {errorId}."
java = "unknown_error"
when = "A refusal the Java code raises with a key its bundle lacks, with nothing more specific known."
