# ---- Certificates ----

[SEC.REQUEST_EXISITING]
status = 409
text = "A certificate request for this address is already in progress."
action = "Wait for it to finish before asking again."
java = ["request_exisiting", "request_existing"]
java_text = "Internal Server Error (Unknown)"
when = "Asking for a certificate while one is being issued (Java misspells the key, so it answers the unknown error)."
audience = "system admins"

[SEC.BAD_CERT_REQUEST]
status = 400
text = "The certificate request needs an address and its domain names."
action = "Add the address and the domain names, then try again."
java = "bad_cert_request"
when = "A certificate request without an address or domains."
audience = "system admins"

[SEC.MISMATCH_DOMAINS]
status = 400
params = ["domains"]
text = "[These domains don't belong to the address: {domains}.|Some domains don't belong to the address.]"
action = "Use only domains of the address the certificate is for."
java = "mismatch_domains"
when = "A certificate request with domains outside the address."
audience = "system admins"

[SEC.ERROR_KEY_CSR]
status = 500
text = "We couldn't create the certificate's key or signing request."
action = "Try again. If it keeps happening, give support the error id {errorId}."
java = "error_key_csr"
when = "Key or CSR generation failed."
audience = "system admins"

[SEC.LETS_ENCRYPT_CREDENTIALS]
status = 500
text = "Certificates can't be issued: the Let's Encrypt account is not set up."
action = "Ask support to set up the Let's Encrypt login, session and key."
java = "lets_encrypt_credentials"
when = "The ACME account is not configured."
audience = "system admins"

[SEC.LETS_ENCRYPT_ISSUE]
status = 500
params = ["detail"]
text = "Let's Encrypt refused the request[: {detail}]."
action = "Check the domain's DNS and try again. If it keeps happening, give support the error id {errorId}."
java = "lets_encrypt_issue"
when = "The ACME server answered with an error."
audience = "system admins"

[SEC.TRIGGER_FAILED]
status = 500
text = "We couldn't start the domain check for the certificate."
action = "Try again in a moment."
java = "trigger_failed"
when = "Triggering the ACME challenge failed."
audience = "system admins"

[SEC.CRT_KEY_ISSUE]
status = 400
params = ["detail"]
text = "The certificate or its key can't be used[: {detail}]."
action = "Check that the certificate, its chain and the private key belong together, then try again."
java = "crt_key_issue"
when = "Uploading a certificate whose files do not parse or do not match."
audience = "system admins"

[SEC.CERTIFICATE_PROBLEM]
status = 500
text = "The issued certificate has a problem."
java = "certificate_problem"
when = "Not raised by the Rust units (kept for the Java bundle's mapping)."
audience = "system admins"

