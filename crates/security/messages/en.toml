params = ["id"]
text = "Something went wrong on our side. Error id {errorId}: give it to support."
action = "Try again in a moment."
java = "unknown_error_with_id"
when = "Any unexpected failure (the Rust units answer COMMON.INTERNAL_ERROR, which says the same)."
audience = "anyone"

[SEC.CLIENT_HIERARCHY_MISSING]
