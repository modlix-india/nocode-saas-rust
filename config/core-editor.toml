# core-editor on the local stack. Secrets (MODLIX__DATABASE__PASSWORD, MODLIX__REDIS__URL) come
# from config/local.toml; the local Mongo needs no credentials (set MODLIX__MONGO__URI where it does).
# It runs core-exec's state as well (a storage's definition triggers are core functions), so it
# needs the same databases and services; RabbitMQ is left unconfigured (publishing off).

[server]
port = 8111

[telemetry]
log_format = "pretty"
log_level = "info"
environment = "local"

[mongo]
uri = "mongodb://localhost:27017"
database = "core"

[database]
host = "localhost"
port = 3306
database = "core"
username = "root"
max_connections = 8

[redis]
cache_prefix = "cmn"
eviction_channel = "evictionChannel"

[security]
# security-admin: every security route that is neither auth nor internal.
upstream = "http://localhost:8113"
# AuthenticationController (the caller context on every request) runs in security-auth.
auth_upstream = "http://localhost:8101"
# The service-to-service routes (clients/internal, users/internal, ...) run in security-internal.
internal_upstream = "http://localhost:8112"

[core]
# Core's own internal routes for the platform jobs (core-editor).
upstream = "http://localhost:8111"
function_timeout_seconds = 300
java_zone_offset = "+05:30"

[files]
# files-manage (the files internal routes).
upstream = "http://localhost:8104"

[ui]
# ui-editor (the transport cleanup the platform jobs call).
upstream = "http://localhost:8107"

[registry]
# Registers in the local Lighthouse pair (dashboard http://localhost:8761/).
register = true
register_as = "CORE-EDITOR"
zones = ["http://localhost:8761/eureka/", "http://localhost:8762/eureka/"]
