# gateway-rust on the local stack: the same routes as the Spring gateway (nocode-saas configfiles
# gateway.yml), with every Java service followed through the local Eureka. Listens on 8180 next to
# the Spring gateway on 8080.

[server]
port = 8180

[telemetry]
log_format = "pretty"
log_level = "info"
environment = "local"

[eureka]
zones = ["http://localhost:9999/eureka/"]

[redis]
# The Java services' effective prefix; security's evictions of the host cache reach the gateway.
cache_prefix = "cmn"
eviction_channel = "evictionChannel"

[security]
upstream = "eureka:SECURITY"
# The service-to-service routes (clients/internal, users/internal, ...) run in security-internal.
internal_upstream = "http://localhost:8112"

# Resilience, per pool. Every pool has these defaults; a pool overrides any of them in its own
# sub-table (for example [pools.core-exec.breaker] with open_ms = 10000 under it).
#
# [pools.NAME]
# discovery_refresh_ms = 2000     # how often an eureka: pool reads the registry
#
# [pools.NAME.outlier]
# consecutive_5xx = 5             # 502/503/504, broken connections or timeouts in a row; 0 = off
# base_ejection_ms = 10000        # ejected for this times the number of ejections so far...
# max_ejection_ms = 120000        # ...at most this, then back at its next passing health check
# max_ejection_percent = 50       # never more of the pool than this at once
#
# [pools.NAME.retry]
# on_5xx = true                   # one retry elsewhere for a GET/HEAD/OPTIONS/PUT/DELETE without
#                                 # a body answered 502/503/504 (connect failures always retry)
# jitter_min_ms = 25
# jitter_max_ms = 50
# budget_percent = 20             # 5xx retries stay within 20% of the pool's requests...
# budget_window_seconds = 10      # ...over 10 s...
# budget_min_per_second = 3       # ...or 3 a second, whichever allows more
#
# [pools.NAME.breaker]
# enabled = true
# window_seconds = 10             # measured in 1 s buckets
# min_requests = 20               # opens at 20 or more requests in the window...
# failure_percent = 50            # ...with 50% or more failed; then 503 at once
# open_ms = 5000                  # for 5 s, then half_open_trials requests go through:
# half_open_trials = 3            # all pass and it closes, one fails and it opens again
# max_open_ms = 60000             # for twice as long, up to this

[pools.security]
upstreams = "eureka:SECURITY"
health_path = "/actuator/health"

[pools.files]
upstreams = "eureka:FILES"
health_path = "/actuator/health"

[pools.core]
upstreams = "eureka:CORE"
health_path = "/actuator/health"

[pools.ui]
upstreams = "eureka:UI"
health_path = "/actuator/health"

[pools.multi]
upstreams = "eureka:MULTI"
health_path = "/actuator/health"

[pools.entity-processor]
upstreams = "eureka:ENTITY-PROCESSOR"
health_path = "/actuator/health"

[pools.notification]
upstreams = "eureka:NOTIFICATION"
health_path = "/actuator/health"

[pools.message]
upstreams = "eureka:MESSAGE"
health_path = "/actuator/health"

[pools.worker]
upstreams = "eureka:WORKER"
health_path = "/actuator/health"

[pools.schedular]
upstreams = "eureka:SCHEDULAR"
health_path = "/actuator/health"

[pools.data]
upstreams = "eureka:DATA"
health_path = "/actuator/health"

[pools.adzump]
upstreams = "eureka:ADZUMP"
health_path = "/actuator/health"

[pools.ai]
upstreams = "eureka:AI"
health_path = "/health"

[[routes]]
id = "security"
prefix = "/api/security"
pool = "security"

[[routes]]
id = "files"
prefix = "/api/files"
pool = "files"

[[routes]]
id = "data"
prefix = "/api/data"
pool = "data"

[[routes]]
id = "core"
prefix = "/api/core"
pool = "core"

[[routes]]
id = "schedular"
prefix = "/api/schedular"
pool = "schedular"

[[routes]]
id = "multi"
prefix = "/api/multi"
pool = "multi"

[[routes]]
id = "entity-processor"
prefix = "/api/entity/processor"
pool = "entity-processor"

[[routes]]
id = "notification"
prefix = "/api/notification"
pool = "notification"

[[routes]]
id = "message"
prefix = "/api/message"
pool = "message"

[[routes]]
id = "worker"
prefix = "/api/worker"
pool = "worker"

[[routes]]
id = "entity-collector"
prefix = "/api/entity/collector"
pool = "entity-processor"

[[routes]]
id = "ai"
prefix = "/api/ai"
pool = "ai"

[[routes]]
id = "adzump"
prefix = "/api/adzump"
pool = "adzump"

[[routes]]
id = "ui"
prefix = "/"
pool = "ui"
