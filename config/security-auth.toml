# security-auth on the local stack. Secrets come from config/local.toml:
# MODLIX__DATABASE__PASSWORD, MODLIX__REDIS__URL, MODLIX__JWT__KEY (and MODLIX__MQ__URI to publish
# OTP events, MODLIX__SMS__TWO_FACTOR_API_KEY to send SMS; both left out locally on purpose).

[server]
port = 8101

[telemetry]
log_format = "pretty"
log_level = "info"
environment = "local"

[database]
host = "localhost"
port = 3306
database = "security"
username = "root"
max_connections = 16

[redis]
cache_prefix = "cmn"
eviction_channel = "evictionChannel"

[jwt]
# jwt.token.default.expiry / jwt.token.rememberme.expiry / jwt.token.default.refresh
default_expiry_minutes = 30
remember_me_expiry_minutes = 525600
refresh_minutes = 10

[security]
app_code_suffix = ".local"
subdomain_endings = ".local.modlix.com, .local.sitezump.ai"
one_time_token_max_age_minutes = 5

[otp]
# Local: the USER_OTP_GENERATE event is logged, not published, so no e-mail leaves.
publish_events = false

[mq]
exchange = "events"
routing_keys = "events1,events2,events3"

[eureka]
# Registers in the local Lighthouse pair (dashboard http://localhost:8761/).
register = true
register_as = "SECURITY-AUTH"
zones = ["http://localhost:8761/eureka/", "http://localhost:8762/eureka/"]
