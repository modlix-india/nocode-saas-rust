# core-scheduler, local. Since the local stack runs without Java (2026-10-18) it is the only
# scheduler: ON, publishing to the real `events` exchange that core-events consumes. Never run it
# next to a Java core scheduler on the same Mongo.
# core-exec on the local stack. Secrets (MODLIX__DATABASE__PASSWORD, MODLIX__REDIS__URL) come
# from config/local.toml; the local Mongo needs no credentials (set MODLIX__MONGO__URI where it does).

[server]
port = 8108

[telemetry]
log_format = "pretty"
log_level = "info"
environment = "local"

[mongo]
uri = "mongodb://localhost:27017"
database = "core"

[database]
host = "localhost"
port = 3306
database = "core"
username = "root"
max_connections = 8

[redis]
cache_prefix = "cmn"
eviction_channel = "evictionChannel"

[security]
# security-admin: every security route that is neither auth nor internal.
upstream = "http://localhost:8113"
# AuthenticationController (the caller context on every request) runs in security-auth.
auth_upstream = "http://localhost:8101"
# The service-to-service routes (clients/internal, users/internal, ...) run in security-internal.
internal_upstream = "http://localhost:8112"

[core]
# Core's own internal routes for the platform jobs (core-editor).
upstream = "lighthouse:CORE-EDITOR"
function_timeout_seconds = 300
java_zone_offset = "+05:30"

[core.scheduler]
# Local stack without Java (2026-10-18): this is the only scheduler.
enabled = true

[mq]
# A scratch exchange: never the real `events` while Java core consumes it.
events_exchange = "events"
events_routing_keys = "events1,events2,events3"

[registry]
# Registers in the local Lighthouse pair (dashboard http://localhost:8761/).
register = true
register_as = "CORE-SCHEDULER"
zones = ["http://localhost:8761/eureka/", "http://localhost:8762/eureka/"]
