# ui-shell on the local stack. Secrets (MODLIX__MONGO__URI, MODLIX__REDIS__URL,
# MODLIX__SHELL__ANALYTICS_ENGINE_SECRET) come from config/local.toml.

[server]
port = 8106

[telemetry]
log_format = "pretty"
log_level = "info"
environment = "local"

[redis]
# The effective redis.cache.prefix of every Java service (application-<profile>.yml).
cache_prefix = "cmn"
eviction_channel = "evictionChannel"

[security]
# security-admin: every security route that is neither auth nor internal.
upstream = "http://localhost:8113"
# AuthenticationController (the caller context on every request) runs in security-auth.
auth_upstream = "http://localhost:8101"
# The service-to-service routes (clients/internal, users/internal, ...) run in security-internal.
internal_upstream = "http://localhost:8112"

[core]
# URI path routes run their KIRun functions on core-exec (/api/core/function/execute).
upstream = "lighthouse:CORE-EXEC"
timeout_seconds = 60

[mongo]
max_pool_size = 32

[ui]
resource_cache_age = 604800
# The Java ui's JVM runs in the developer machine's zone (IST) locally; +00:00 in containers.
java_zone_offset = "+05:30"

[shell]
# ui.* and security.appCodeSuffix of the Java ui (application-default.yml locally).
cdn_host_name = "cdn-local.modlix.com"
cdn_strip_api_prefix = true
cdn_replace_plus = true
cdn_resize_options_type = "none"
app_code_suffix = ".local"
js_url = "https://cdn-local.modlix.com/js/dist/"
analytics_ingestion_host = "https://engine.local.modlix.com"
analytics_engine_url = "http://localhost:8096"
ssr_channel = "ssr:cache:invalidation"

[registry]
# Registers in the local Lighthouse pair (dashboard http://localhost:8761/).
register = true
register_as = "UI-SHELL"
zones = ["http://localhost:8761/eureka/", "http://localhost:8762/eureka/"]
