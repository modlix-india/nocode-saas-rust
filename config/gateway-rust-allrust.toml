# TEST VARIANT on 8182: every path with a Rust unit goes to it (files, multi, ui-engine, core-exec). gateway-rust on the local stack: the same routes as the Spring gateway (nocode-saas configfiles
# gateway.yml), with every Java service followed through the local Eureka. Listens on 8180 next to
# the Spring gateway on 8080.

[server]
port = 8182

[telemetry]
log_format = "pretty"
log_level = "info"
environment = "local"

[eureka]
zones = ["http://localhost:9999/eureka/"]

[redis]
# The Java services' effective prefix; security's evictions of the host cache reach the gateway.
cache_prefix = "cmn"
eviction_channel = "evictionChannel"

[security]
# security-admin: every security route that is neither auth nor internal.
upstream = "http://localhost:8113"
# The service-to-service routes (clients/internal, users/internal, ...) run in security-internal.
internal_upstream = "http://localhost:8112"

[pools.security]
upstreams = "eureka:SECURITY"
health_path = "/actuator/health"

[pools.files]
upstreams = "eureka:FILES"
health_path = "/actuator/health"

[pools.core]
upstreams = "eureka:CORE"
health_path = "/actuator/health"

[pools.ui]
upstreams = "eureka:UI"
health_path = "/actuator/health"

[pools.multi]
upstreams = "eureka:MULTI"
health_path = "/actuator/health"

[pools.entity-processor]
upstreams = "eureka:ENTITY-PROCESSOR"
health_path = "/actuator/health"

[pools.notification]
# Rust notification (it consumes scratch queues locally; its HTTP routes read the real tables).
upstreams = ["http://localhost:8114"]
health_path = "/readyz"

[pools.message]
upstreams = "eureka:MESSAGE"
health_path = "/actuator/health"

[pools.worker]
upstreams = "eureka:WORKER"
health_path = "/actuator/health"

[pools.schedular]
upstreams = "eureka:SCHEDULAR"
health_path = "/actuator/health"

[pools.data]
upstreams = "eureka:DATA"
health_path = "/actuator/health"

[pools.adzump]
upstreams = "eureka:ADZUMP"
health_path = "/actuator/health"

[pools.ai]
upstreams = "eureka:AI"
health_path = "/health"

