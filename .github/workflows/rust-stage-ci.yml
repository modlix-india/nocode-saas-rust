# The Rust units for stage: on a push to oci-stage (or by hand), build all 15 images, push
# ocir.../idfmutpuhiky/stage-<unit>:<sha> and :latest, then deploy them to the stage host with
# keepup-rust.sh. The work is in rust-build-deploy.yml.
#
# The deploy job runs only when the repository variable RUST_DEPLOY_STAGE is 'true': until the
# switch the images are built and pushed, and nothing touches the host (the runbook: oci-config rust/RUNBOOK.md).

name: rust-stage-ci

on:
  push:
    branches:
      - oci-stage
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/Dockerfile.prebuilt'
      - '.github/workflows/rust-build-deploy.yml'
      - '.github/workflows/rust-stage-ci.yml'
  workflow_dispatch:
    inputs:
      units:
        description: Units to deploy, space separated (empty deploys all 15; gateway-rust always goes last)
        required: false
        type: string
        default: ''

permissions:
  contents: read

# One run at a time per environment; a newer push waits for the running deploy to finish.
concurrency:
  group: rust-stage
  cancel-in-progress: false

jobs:
  build-deploy:
    uses: ./.github/workflows/rust-build-deploy.yml
    with:
      environment: stage
      ssh_key: /home/ubuntu/keys/dev-internal.key
      deploy: ${{ vars.RUST_DEPLOY_STAGE == 'true' }}
      units: ${{ inputs.units || '' }}
    secrets:
      ocir_user: ${{ secrets.OCI_NON_PROD_DOCKER_USER_NAME }}
      ocir_token: ${{ secrets.OCI_NON_PROD_CLI_AUTH_TOKEN }}
      server_ip: ${{ secrets.STAGE_SERVER_IP }}
