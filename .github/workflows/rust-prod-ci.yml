# The Rust units for prod: on a push to oci-production (or by hand), build the images of the units it changed (of 15 units, Lighthouse and pdf-render), push
# ocir.../idfmutpuhiky/prod-<unit>:<sha> and :latest, then deploy them to the prod host with
# keepup-rust.sh. The work is in rust-build-deploy.yml.

name: rust-prod-ci

on:
  push:
    branches:
      - oci-production
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/Dockerfile.prebuilt'
      - 'deploy/pdf-render/**'
      - 'sql/**'
      - 'tools/ci_sql.sh'
      - '.github/workflows/rust-build-deploy.yml'
      - '.github/workflows/rust-prod-ci.yml'
  workflow_dispatch:
    inputs:
      units:
        description: Units to deploy, space separated (empty builds and deploys what the push changed; Lighthouse first, gateway-rust last)
        required: false
        type: string
        default: ''

permissions:
  contents: read

# One run at a time per environment; a newer push waits for the running deploy to finish.
concurrency:
  group: rust-prod
  cancel-in-progress: false

jobs:
  build-deploy:
    uses: ./.github/workflows/rust-build-deploy.yml
    with:
      environment: prod
      profile: release
      ssh_key: /home/ubuntu/keys/prod-internal.key
      deploy: true
      units: ${{ inputs.units || '' }}
    secrets:
      ocir_user: ${{ secrets.OCI_NON_PROD_DOCKER_USER_NAME }}
      ocir_token: ${{ secrets.OCI_NON_PROD_CLI_AUTH_TOKEN }}
      server_ip: ${{ secrets.PROD_SERVER_IP }}
      lighthouse_github_token: ${{ secrets.LIGHTHOUSE_GITHUB_TOKEN }}
      lighthouse_admin_token_sha256: ${{ secrets.LIGHTHOUSE_ADMIN_TOKEN_SHA256 }}
      db_user: ${{ secrets.PROD_DB_USER }}
      db_password: ${{ secrets.PROD_DB_PASSWORD }}
