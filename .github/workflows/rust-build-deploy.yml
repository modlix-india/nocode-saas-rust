# Builds the 15 Rust units' images, Lighthouse's and pdf-render's, and deploys them to one
# environment's host. Called by rust-dev-ci.yml, rust-stage-ci.yml and rust-prod-ci.yml, which
# name the environment, the secrets and whether the deploy runs.
#
# build (GitHub-hosted): compiles the workspace ONCE in release (in rust:1.94-bookworm, the image
# deploy/Dockerfile builds in, so the binaries match the distroless runtime's glibc), with the
# cargo registry and the dependencies' build output cached; packages each binary into its own
# image with deploy/Dockerfile.prebuilt; pushes <env>-<unit>:<sha> and :latest to OCIR.
# pdf-render (deploy/pdf-render: WeasyPrint, Python) is no cargo binary: its image is built from
# its own Dockerfile and its tests run in it before anything is pushed; a push that changes only
# it compiles nothing.
#
# sql-plan (self-hosted, alongside build): tools/ci_sql.sh checks with Flyway, on the host, that
# every file of sql/ already applied to the environment's databases is unchanged, and lists the
# pending ones. sql-apply applies them, behind the GitHub environment rust-sql-<env> (give
# rust-sql-prod required reviewers, so a person reads the pending list before prod changes).
# Units are replaced only after the SQL is in: sql/README.md says why every change must work
# with the release still running.
#
# deploy (self-hosted, the runner the Java workflows use): one SSH per unit running
# `keepup-rust.sh --env <env> deploy <unit> <image>` on the host, gateway-rust last, stopping at
# the first failure.

name: rust-build-deploy

on:
  workflow_call:
    inputs:
      environment:
        description: dev, stage or prod (the OCIR repository prefix)
        required: true
        type: string
      ssh_key:
        description: The SSH key on the self-hosted runner that reaches the host
        required: true
        type: string
      deploy:
        description: Run the deploy job (false builds and pushes only)
        required: true
        type: boolean
      profile:
        description: The cargo profile the binaries are built with (ci for dev and stage, release for prod)
        required: false
        type: string
        default: release
      units:
        description: Space-separated units to build and deploy; empty builds and deploys the units the push changed (all 17 when it cannot tell)
        required: false
        type: string
        default: ''
    secrets:
      ocir_user:
        required: true
      ocir_token:
        required: true
      server_ip:
        required: true
      # Lighthouse's read-only token for oci-config-rust. It reaches the host only inside the
      # deploy's SSH session (never a file there, never a command line); docker keeps it in the
      # Lighthouse containers' settings until the next deploy.
      lighthouse_github_token:
        required: false
      # SHA-256 of the dashboard's admin token; empty leaves the dashboard read-only.
      lighthouse_admin_token_sha256:
        required: false
      # The MySQL user sql-plan and sql-apply run as (it creates and alters tables). Without them
      # the deploy stops at sql-plan.
      db_user:
        required: false
      db_password:
        required: false

permissions:
  contents: read

env:
  OCIR_HOST: ocir.us-ashburn-1.oci.oraclecloud.com
  OCIR_NAMESPACE: ocir.us-ashburn-1.oci.oraclecloud.com/idfmutpuhiky
  RUST_IMAGE: rust:1.94-bookworm
  # Every unit, in deploy order: Lighthouse first (every other unit reads its configuration from
  # it), then security (every other unit calls it), pdf-render before core (which calls it),
  # gateway-rust last.
  UNITS: >-
    lighthouse
    security-auth security-internal security-admin
    pdf-render
    core-editor core-exec core-events core-scheduler
    ui-editor ui-engine ui-shell
    files-manage files-serve
    multi notification
    gateway-rust
  # The units that are no cargo binary: each image is built from deploy/<unit>/Dockerfile.
  IMAGE_UNITS: pdf-render
  # The workspace packages, whose build output is left out of the cache (it changes every run).
  WORKSPACE_PACKAGES: platform gateway files overridable ui core appdata connections multi security notification lighthouse lighthouse-client

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      image_tag: ${{ github.sha }}
      units: ${{ steps.units.outputs.units }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only the units a push changed are built, pushed and deployed: the changed paths, mapped to
      # their crates and every workspace crate that depends on them (tools/ci_affected_units.py).
      # A manual run with `units` names them; a new branch or anything it cannot tell, all.
      - name: Work out the units to build
        id: units
        env:
          ONLY: ${{ inputs.units }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$ONLY" ]; then
            for unit in $ONLY; do
              case " $UNITS " in
                *" $unit "*) ;;
                *) echo "::error::unknown unit '$unit' (known: $UNITS)"; exit 1 ;;
              esac
            done
            selected=""
            for unit in $UNITS; do case " $ONLY " in *" $unit "*) selected="$selected $unit" ;; esac; done
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            cargo metadata --format-version 1 --no-deps --offline > "$RUNNER_TEMP/metadata.json"
            read -ra all <<< "$UNITS"
            selected="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | python3 tools/ci_affected_units.py "$RUNNER_TEMP/metadata.json" "${all[@]}")"
          else
            selected="$UNITS"
          fi
          read -ra picked <<< "$selected"
          selected="${picked[*]}"
          # The ones cargo compiles: every selected unit but the IMAGE_UNITS.
          cargo_units=""
          for unit in $selected; do case " $IMAGE_UNITS " in *" $unit "*) ;; *) cargo_units="$cargo_units $unit" ;; esac; done
          read -ra picked <<< "$cargo_units"
          cargo_units="${picked[*]}"
          echo "units=$selected" >> "$GITHUB_OUTPUT"
          echo "cargo_units=$cargo_units" >> "$GITHUB_OUTPUT"
          echo "Units to build and deploy: ${selected:-none} (compiled by cargo: ${cargo_units:-none})"

      - name: Restore the cargo cache
        id: cache
        if: steps.units.outputs.cargo_units != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci/cargo/registry/index
            .ci/cargo/registry/cache
            .ci/cargo/git/db
            target
          key: cargo-${{ inputs.profile }}-rust1.94-bookworm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ inputs.profile }}-rust1.94-bookworm-

      # A cold build needs more room than the runner leaves free; with a cache restored there is
      # enough, and this takes a minute and a half.
      - name: Free disk space
        if: steps.units.outputs.cargo_units != '' && steps.cache.outputs.cache-matched-key == ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Compile the binaries in one cargo run
        if: steps.units.outputs.cargo_units != ''
        env:
          SELECTED: ${{ steps.units.outputs.cargo_units }}
          PROFILE: ${{ inputs.profile }}
        run: |
          mkdir -p .ci/cargo/registry .ci/cargo/git target
          bins=()
          for unit in $SELECTED; do bins+=(--bin "$unit"); done
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_TERM_COLOR=always \
            -e GIT_SHA="$GITHUB_SHA" \
            -v "$PWD:/src" -w /src \
            -v "$PWD/.ci/cargo/registry:/usr/local/cargo/registry" \
            -v "$PWD/.ci/cargo/git:/usr/local/cargo/git" \
            "$RUST_IMAGE" \
            cargo build --profile "$PROFILE" --locked "${bins[@]}"

      - name: Stage each binary as its own image context
        if: steps.units.outputs.cargo_units != ''
        env:
          SELECTED: ${{ steps.units.outputs.cargo_units }}
          PROFILE: ${{ inputs.profile }}
        run: |
          for unit in $SELECTED; do
            mkdir -p "dist/$unit"
            cp "target/$PROFILE/$unit" "dist/$unit/app"
          done
          ls -l dist/*/app

      - name: Trim the cache to the dependencies
        if: steps.units.outputs.cargo_units != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          pkgs=()
          for p in $WORKSPACE_PACKAGES; do pkgs+=(-p "$p"); done
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            -v "$PWD/.ci/cargo/registry:/usr/local/cargo/registry" \
            -v "$PWD/.ci/cargo/git:/usr/local/cargo/git" \
            "$RUST_IMAGE" \
            cargo clean --profile "$PROFILE" "${pkgs[@]}"
          rm -rf .ci/cargo/registry/src .ci/cargo/git/checkouts
          du -sh target .ci/cargo || true

      - name: Save the cargo cache
        if: steps.units.outputs.cargo_units != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/cargo/registry/index
            .ci/cargo/registry/cache
            .ci/cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build the images
        if: steps.units.outputs.units != ''
        env:
          ENV_NAME: ${{ inputs.environment }}
          TAG: ${{ github.sha }}
          SELECTED: ${{ steps.units.outputs.units }}
        run: |
          for unit in $SELECTED; do
            repo="$OCIR_NAMESPACE/$ENV_NAME-$unit"
            # A cargo binary staged in dist/<unit>; an IMAGE_UNITS one from its own directory.
            case " $IMAGE_UNITS " in
              *" $unit "*) dockerfile="deploy/$unit/Dockerfile"; context="deploy/$unit" ;;
              *) dockerfile=deploy/Dockerfile.prebuilt; context="dist/$unit" ;;
            esac
            docker build -f "$dockerfile" \
              --label "org.opencontainers.image.revision=$TAG" \
              --label "org.opencontainers.image.title=$unit" \
              -t "$repo:$TAG" -t "$repo:latest" \
              "$context"
          done

      # pdf-render's own tests (its URL policy and real WeasyPrint renders with the image's fonts),
      # in the image just built: a failure stops the run before anything is pushed.
      - name: Test the pdf-render image
        if: contains(format(' {0} ', steps.units.outputs.units), ' pdf-render ')
        env:
          ENV_NAME: ${{ inputs.environment }}
          TAG: ${{ github.sha }}
        run: docker run --rm --entrypoint python "$OCIR_NAMESPACE/$ENV_NAME-pdf-render:$TAG" -m unittest -v test_app

      - name: Log in to OCIR
        if: steps.units.outputs.units != ''
        env:
          OCIR_USER: ${{ secrets.ocir_user }}
          OCIR_TOKEN: ${{ secrets.ocir_token }}
        run: printf '%s' "$OCIR_TOKEN" | docker login "$OCIR_HOST" -u "$OCIR_USER" --password-stdin

      # Every <sha> tag first, then every latest, so a push that fails half way leaves latest
      # on one release for all the units built.
      - name: Push the images
        if: steps.units.outputs.units != ''
        env:
          ENV_NAME: ${{ inputs.environment }}
          TAG: ${{ github.sha }}
          SELECTED: ${{ steps.units.outputs.units }}
        run: |
          for unit in $SELECTED; do docker push "$OCIR_NAMESPACE/$ENV_NAME-$unit:$TAG"; done
          for unit in $SELECTED; do docker push "$OCIR_NAMESPACE/$ENV_NAME-$unit:latest"; done

  # On every deploy, not only when sql/ changed: an environment left behind (prod was three
  # security, one core and one files migration short at the move) is caught up before units that
  # may need the newer schema.
  sql-plan:
    if: inputs.deploy
    runs-on: self-hosted
    timeout-minutes: 15

    outputs:
      pending: ${{ steps.plan.outputs.pending }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the applied SQL is unchanged and list what is pending
        id: plan
        env:
          ENV_NAME: ${{ inputs.environment }}
          SSH_KEY: ${{ inputs.ssh_key }}
          SERVER_IP: ${{ secrets.server_ip }}
          TAG: ${{ github.sha }}
          DB_USER: ${{ secrets.db_user }}
          DB_PASSWORD: ${{ secrets.db_password }}
        run: tools/ci_sql.sh ship plan

  sql-apply:
    needs: sql-plan
    if: needs.sql-plan.outputs.pending != '0'
    runs-on: self-hosted
    timeout-minutes: 30
    environment: rust-sql-${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Apply the pending SQL
        env:
          ENV_NAME: ${{ inputs.environment }}
          SSH_KEY: ${{ inputs.ssh_key }}
          SERVER_IP: ${{ secrets.server_ip }}
          TAG: ${{ github.sha }}
          DB_USER: ${{ secrets.db_user }}
          DB_PASSWORD: ${{ secrets.db_password }}
        run: tools/ci_sql.sh ship migrate

  deploy:
    needs: [build, sql-plan, sql-apply]
    # sql-apply is skipped when nothing is pending; any failure, or a refused approval, stops here.
    if: >-
      !cancelled() && inputs.deploy && needs.build.outputs.units != ''
      && needs.build.result == 'success' && needs.sql-plan.result == 'success'
      && (needs.sql-apply.result == 'success' || needs.sql-apply.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Deploy the units built, gateway-rust last, stopping at the first failure
        env:
          ENV_NAME: ${{ inputs.environment }}
          SSH_KEY: ${{ inputs.ssh_key }}
          SERVER_IP: ${{ secrets.server_ip }}
          TAG: ${{ needs.build.outputs.image_tag }}
          SELECTED: ${{ needs.build.outputs.units }}
          LIGHTHOUSE_GITHUB_TOKEN: ${{ secrets.lighthouse_github_token }}
          LIGHTHOUSE_ADMIN_TOKEN_SHA256: ${{ secrets.lighthouse_admin_token_sha256 }}
        run: |
          set -euo pipefail
          # The units the build job built, already in deploy order (Lighthouse first,
          # gateway-rust last).
          selected="$SELECTED"
          for unit in $selected; do
            image="$OCIR_NAMESPACE/$ENV_NAME-$unit:$TAG"
            echo "::group::deploy $unit ($image)"
            if [ "$unit" = lighthouse ]; then
              if [ -z "$LIGHTHOUSE_GITHUB_TOKEN" ]; then
                echo "::error::the repository secret LIGHTHOUSE_GITHUB_TOKEN is not set: Lighthouse cannot read oci-config-rust"
                exit 1
              fi
              # The tokens go over the SSH session's stdin, read into the remote shell's
              # environment: never a file on the host, never a command line.
              printf '%s\n%s\n' "$LIGHTHOUSE_GITHUB_TOKEN" "$LIGHTHOUSE_ADMIN_TOKEN_SHA256" | \
                ssh -i "$SSH_KEY" -o BatchMode=yes "opc@$SERVER_IP" \
                "IFS= read -r LIGHTHOUSE_GITHUB_TOKEN; IFS= read -r LIGHTHOUSE_ADMIN_TOKEN_SHA256; export LIGHTHOUSE_GITHUB_TOKEN LIGHTHOUSE_ADMIN_TOKEN_SHA256; set -o pipefail; bash /home/opc/rust/scripts/keepup-rust.sh --env $ENV_NAME deploy lighthouse $image 2>&1 | tee -a /var/log/keepup.log"
            else
              ssh -i "$SSH_KEY" -o BatchMode=yes "opc@$SERVER_IP" \
                "set -o pipefail; bash /home/opc/rust/scripts/keepup-rust.sh --env $ENV_NAME deploy $unit $image 2>&1 | tee -a /var/log/keepup.log"
            fi
            echo "::endgroup::"
          done
          echo "deployed:$selected"
