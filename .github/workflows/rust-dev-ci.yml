# The Rust units for dev: on a push to oci-development (or by hand), build all 15 images, push
# ocir.../idfmutpuhiky/dev-<unit>:<sha> and :latest, then deploy them to the dev host with
# keepup-rust.sh. The work is in rust-build-deploy.yml.

name: rust-dev-ci

on:
  push:
    branches:
      - oci-development
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/Dockerfile.prebuilt'
      - '.github/workflows/rust-build-deploy.yml'
      - '.github/workflows/rust-dev-ci.yml'
  workflow_dispatch:
    inputs:
      units:
        description: Units to deploy, space separated (empty deploys all 15; gateway-rust always goes last)
        required: false
        type: string
        default: ''

permissions:
  contents: read

# One run at a time per environment; a newer push waits for the running deploy to finish.
concurrency:
  group: rust-dev
  cancel-in-progress: false

jobs:
  build-deploy:
    uses: ./.github/workflows/rust-build-deploy.yml
    with:
      environment: dev
      ssh_key: /home/ubuntu/keys/dev-internal.key
      deploy: true
      units: ${{ inputs.units || '' }}
    secrets:
      ocir_user: ${{ secrets.OCI_NON_PROD_DOCKER_USER_NAME }}
      ocir_token: ${{ secrets.OCI_NON_PROD_CLI_AUTH_TOKEN }}
      server_ip: ${{ secrets.DEV_SERVER_IP }}
